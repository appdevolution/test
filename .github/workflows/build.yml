name: Build Typewriter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare fonts and typewriter sounds
        run: python3 scripts/prepare_assets.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare downloadable files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Typewriter-v0.1-debug.apk
          zip -r Typewriter-Project.zip app scripts settings.gradle.kts build.gradle.kts README.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Typewriter-Android
          path: |
            Typewriter-v0.1-debug.apk
            Typewriter-Project.zip
          if-no-files-found: error
