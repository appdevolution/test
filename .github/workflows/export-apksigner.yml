name: Export APK Signer

on:
  push:
    branches: [ "main" ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Package apksigner
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p signer
          cp "$SDK/build-tools/35.0.0/apksigner" signer/
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" signer/
      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: Android-ApkSigner
          path: signer/
